<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your plot - Verdantis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Verdantis - satellite moisture and vegetation monitoring, client dashboards.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232c7a3c%22/><path d=%22M50 18 L78 62 H22 Z%22 fill=%22%23f4f8f2%22/></svg>">
<link rel="stylesheet" href="_template/assets/style.css">
<style>
  /* This picker page isn't itself a client dashboard - it's the one place
     in the site that's genuinely shared, so it lives at docs/ root rather
     than inside _template/ (which publish_site.py copies byte-identical
     into every docs/c/<slug>/). Reuses the template's stylesheet directly
     rather than a forked copy, so both stay visually in sync for free. */
  body { background: var(--bg); }
  .picker-wrap { max-width: 720px; margin: 0 auto; padding: 70px clamp(20px, 5vw, 56px) 90px; }
  .picker-wrap h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 10px; }
  .picker-wrap > p { color: var(--text-muted); margin: 0 0 34px; max-width: 60ch; }
  .client-list { display: flex; flex-direction: column; gap: 14px; }
  .client-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 22px; text-decoration: none; color: var(--text);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .client-row:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(20,35,26,0.14); }
  .client-row .name { font-weight: 700; font-size: 1.05rem; }
  .client-row .loc { font-size: 0.88rem; color: var(--text-muted); margin-top: 2px; }
  .client-row .go { font-size: 0.85rem; font-weight: 700; color: var(--green-dark); white-space: nowrap; }
  .empty-note, .error-note { color: var(--text-muted); font-size: 0.92rem; }
  .back-link { display: inline-block; margin-bottom: 22px; font-size: 0.86rem; font-weight: 600; color: var(--text-muted); text-decoration: none; }
  .back-link:hover { color: var(--green-dark); }
</style>
</head>
<body>

<div class="picker-wrap">
  <a class="back-link" href="index.html">&larr; Back to the satellite intelligence briefing</a>
  <span class="eyebrow" style="display:block;margin-bottom:10px;">Verdantis</span>
  <h1>Client dashboards</h1>
  <p>Satellite-based moisture &amp; vegetation monitoring, one dashboard per plot. Each
    client's data is published independently - pick a client below.</p>

  <div class="client-list" id="client-list">
    <p class="empty-note">Loading&hellip;</p>
  </div>
</div>

<script>
fetch('clients.json', { cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (list) {
    var el = document.getElementById('client-list');
    if (!list.length) {
      el.innerHTML = '<p class="empty-note">No clients published yet - run publish_site.py --client &lt;slug&gt;.</p>';
      return;
    }
    el.innerHTML = list.map(function (c) {
      return '<a class="client-row" href="c/' + c.slug + '/index.html">' +
        '<span><span class="name">' + c.display_name + '</span>' +
        '<div class="loc">' + c.location + '</div></span>' +
        '<span class="go">Open dashboard &rarr;</span></a>';
    }).join('');
  })
  .catch(function (err) {
    document.getElementById('client-list').innerHTML =
      '<p class="error-note">Could not load clients.json.</p>';
    console.error(err);
  });
</script>

</body>
</html>
